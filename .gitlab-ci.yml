include:
  - project: repos/m3api/ci-templates
    file: /test+release.yml

stages:
  - test
  - release
  - publish-docs

variables:
  MEDIAWIKI_USERNAME: $MEDIAWIKI_BETA_BOT_USERNAME
  MEDIAWIKI_PASSWORD: $MEDIAWIKI_BETA_BOT_PASSWORD

test-job:
  extends: .test-job

test-package-lock-job:
  extends: .test-package-lock-job

release-job:
  extends: .release-job

publish-job:
  extends: .publish-job

doc-job:
  extends: .doc-job

publish-doc-job:
  extends: .publish-doc-job
